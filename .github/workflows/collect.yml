name: Collect public filings
on:
  workflow_dispatch:
    inputs:
      company:
        description: "Company id (blank = all SEC companies)"
        required: false
        default: ""
      start:
        description: "Filing date from (not fiscal year)"
        default: "2025-01-01"
        required: true
      end:
        description: "Filing date through (not fiscal year)"
        default: "2026-09-23"
        required: true
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect candidates
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          COMPANY: ${{ inputs.company }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          args=(--start "$START" --end "$END")
          if [ -n "$COMPANY" ]; then args+=(--company "$COMPANY"); fi
          python scripts/collect_sec.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-filings-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 90
